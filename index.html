<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Login - Firebase</title>
    <style>
        body {
            background-color: #090d16;
            color: #f1f5f9;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: #131b2e;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            background: #090d16;
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        #status {
            margin-top: 15px;
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Teste de Registo</h2>
        <p style="font-size: 13px; color: #94a3b8;">Insere o teu nome para testar a gravação no Firebase.</p>
        <input type="text" id="nome-input" placeholder="O teu nome..." autocomplete="off">
        <button id="btn-testar">Testar Registo</button>
        <div id="status">Aguardando ação...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAQcXNaZrStco_gXgbgG4ikWa0AexUC8nc",
            authDomain: "cervido-7ce44.firebaseapp.com",
            projectId: "cervido-7ce44",
            storageBucket: "cervido-7ce44.firebasestorage.app",
            messagingSenderId: "57605188151",
            appId: "1:57605188151:web:b3e8de24117097acaf6db2",
            measurementId: "G-VRTT13YEZE"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const statusEl = document.getElementById('status');

        document.getElementById('btn-testar').addEventListener('click', async () => {
            const nome = document.getElementById('nome-input').value.trim();
            if (!nome) {
                alert('Escreve um nome primeiro!');
                return;
            }

            statusEl.innerText = "A ligar ao Firebase...";
            statusEl.style.color = "#818cf8";

            try {
                // Tenta gravar diretamente na coleção 'usuarios_cadastrados'
                const userRef = doc(db, "usuarios_cadastrados", nome);
                await setDoc(userRef, { 
                    nome: nome, 
                    dataTeste: new Date().toISOString() 
                });

                statusEl.innerText = "Sucesso! Utilizador gravado na base de dados.";
                statusEl.style.color = "#34d399";
            } catch (error) {
                console.error("Erro detalhado:", error);
                statusEl.innerText = "Erro: " + error.message;
                statusEl.style.color = "#f87171";
            }
        });
    </script>
</body>
</html>
