<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Galeria - GitHub Pages</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-surface: #1e293b;
            --bg-card: #1e293b;
            --border-color: #334155;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success-color: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }
        
        header { 
            background-color: rgba(30, 41, 59, 0.85); backdrop-filter: blur(12px);
            position: sticky; top: 0; z-index: 100; padding: 16px 32px; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .logo { font-size: 22px; font-weight: 800; background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .menu-options { display: flex; gap: 24px; align-items: center; }
        .user-info { color: var(--text-muted); font-size: 14px; }
        .user-info strong { color: var(--text-main); }
        .counter-badge { background-color: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; color: var(--success-color); }
        .btn-change-name { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
        .btn-change-name:hover { border-color: var(--accent-color); color: var(--text-main); background: rgba(99, 102, 241, 0.1); }

        main { flex: 1; padding: 40px 20px; max-width: 1300px; margin: 0 auto; width: 100%; }

        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
        .card { 
            background-color: var(--bg-card); border-radius: 12px; overflow: hidden; 
            border: 1px solid var(--border-color); display: flex; flex-direction: column; 
            justify-content: space-between; transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 20px -3px rgba(0, 0, 0, 0.4); border-color: var(--accent-color); }
        .card-img-wrapper { width: 100%; height: 190px; overflow: hidden; background-color: #0f172a; }
        .card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .card:hover img { transform: scale(1.05); }
        .card-content { padding: 18px; display: flex; flex-direction: column; gap: 12px; flex: 1; justify-content: space-between; }
        .card-title { font-size: 15px; font-weight: 600; color: var(--text-main); line-height: 1.4; word-break: break-word; }
        .card-btn { display: block; width: 100%; padding: 10px; background-color: var(--accent-color); color: white; text-align: center; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 14px; transition: background-color 0.2s; }
        .card-btn:hover { background-color: var(--accent-hover); }

        footer { background-color: rgba(30, 41, 59, 0.85); backdrop-filter: blur(12px); padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; border-top: 1px solid var(--border-color); }
        .pagination { display: flex; gap: 16px; align-items: center; }
        .page-btn { padding: 10px 20px; background-color: var(--bg-surface); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; transition: all 0.2s; }
        .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .page-btn:hover:not(:disabled) { background-color: var(--accent-color); border-color: var(--accent-color); }
        .page-info { font-size: 14px; color: var(--text-muted); font-weight: 500; }

        #login-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { background: var(--bg-surface); padding: 36px; border-radius: 16px; width: 100%; max-width: 380px; border: 1px solid var(--border-color); text-align: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        .modal-content h2 { margin-bottom: 10px; font-size: 22px; font-weight: 700; color: var(--text-main); }
        .modal-content p { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; line-height: 1.5; }
        .modal-content input { width: 100%; padding: 12px 16px; margin-bottom: 20px; background: #0f172a; border: 1px solid var(--border-color); color: white; border-radius: 8px; font-size: 15px; outline: none; }
        .modal-content input:focus { border-color: var(--accent-color); }
        .modal-content button.btn-submit { width: 100%; padding: 12px; background: var(--accent-color); color: white; border: none; font-weight: 600; font-size: 15px; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        .modal-content button.btn-submit:hover { background: var(--accent-hover); }

        @media (max-width: 900px) { .gallery-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .gallery-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div id="login-modal">
        <div class="modal-content">
            <h2>Bem-vindo(a)</h2>
            <p>Digite seu nome de usuário para continuar.</p>
            <input type="text" id="username-input" placeholder="Seu nome de usuário..." autocomplete="off">
            <button class="btn-submit" onclick="handleLogin()">Entrar na Galeria</button>
        </div>
    </div>

    <header>
        <div class="logo">⚡ Minha Galeria</div>
        <div class="menu-options">
            <span class="user-info">Usuário: <strong id="current-user-display">-</strong></span>
            <div class="counter-badge">Usuários: <span id="user-counter">1</span></div>
            <button class="btn-change-name" onclick="openLoginModal()">Alterar Nome</button>
        </div>
    </header>

    <main>
        <div class="gallery-grid" id="gallery-grid">
            <p style="grid-column: span 3; text-align: center; color: var(--text-muted); padding: 40px;">Buscando packs automaticamente...</p>
        </div>
    </main>

    <footer>
        <div class="pagination">
            <button class="page-btn" id="prev-btn" onclick="changePage(-1)" disabled>← Voltar</button>
            <span class="page-info" id="page-info">Página 1 de 1</span>
            <button class="page-btn" id="next-btn" onclick="changePage(1)" disabled>Avançar →</button>
        </div>
    </footer>

    <script>
        let packsData = [];
        let currentPage = 1;
        const itemsPerPage = 15;

        function initAuth() {
            let currentUser = localStorage.getItem('site_current_user');
            if (!currentUser) {
                document.getElementById('login-modal').style.display = 'flex';
            } else {
                document.getElementById('login-modal').style.display = 'none';
                document.getElementById('current-user-display').innerText = currentUser;
            }
            updateUserCounter();
        }

        function handleLogin() {
            const input = document.getElementById('username-input').value.trim();
            if (!input) {
                alert('Por favor, digite um nome de usuário válido.');
                return;
            }
            localStorage.setItem('site_current_user', input);
            document.getElementById('login-modal').style.display = 'none';
            document.getElementById('current-user-display').innerText = input;
            updateUserCounter();
        }

        function openLoginModal() {
            document.getElementById('username-input').value = localStorage.getItem('site_current_user') || '';
            document.getElementById('login-modal').style.display = 'flex';
        }

        function updateUserCounter() {
            let total = localStorage.getItem('site_total_users');
            if (!total) {
                total = "1";
                localStorage.setItem('site_total_users', total);
            }
            document.getElementById('user-counter').innerText = total;
        }

        // Descobre automaticamente os packs varrendo pastas numéricas (1, 2, 3...)
        async function autoDiscoverPacks() {
            packsData = [];
            let i = 1;
            let consecutiveFailures = 0;

            // Varre até encontrar pastas vazias seguidas
            while (consecutiveFailures < 3 && i <= 200) {
                const folder = `pack/${i}`;
                try {
                    // Tenta ler o info.txt de cada pasta usando fetch direto
                    const infoRes = await fetch(`${folder}/info.txt?` + new Date().getTime());
                    if (infoRes.ok) {
                        const title = (await infoRes.text()).trim();
                        
                        let link = "#";
                        try {
                            const linkRes = await fetch(`${folder}/link.txt`);
                            if (linkRes.ok) link = (await linkRes.text()).trim();
                        } catch (e) {}

                        const image = `${folder}/capa.jpg`;

                        packsData.push({ title, image, link });
                        consecutiveFailures = 0; // achou, zera a contagem de falhas
                    } else {
                        consecutiveFailures++;
                    }
                } catch (e) {
                    consecutiveFailures++;
                }
                i++;
            }

            renderGallery();
        }

        function renderGallery() {
            const grid = document.getElementById('gallery-grid');
            grid.innerHTML = '';

            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginatedItems = packsData.slice(start, end);

            if (paginatedItems.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: span 3; text-align: center; padding: 40px; background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.3); border-radius: 12px;">
                        <p style="color: #818cf8; font-weight: 600; margin-bottom: 8px;">Nenhum pack encontrado ainda!</p>
                        <p style="color: var(--text-muted); font-size: 14px; line-height: 1.6;">
                            Para que apareça automaticamente sem mexer no código, basta criar pastas numeradas dentro de <b>pack/</b>:<br>
                            Exemplo: <b>pack/1/info.txt</b>, <b>pack/1/link.txt</b> e <b>pack/1/capa.jpg</b><br>
                            Depois <b>pack/2/...</b> e assim por diante!
                        </p>
                    </div>
                `;
                return;
            }

            paginatedItems.forEach(pack => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${pack.image}" alt="${pack.title}" onerror="this.src='https://via.placeholder.com/300x190?text=Sem+Capa'">
                    </div>
                    <div class="card-content">
                        <div class="card-title">${pack.title}</div>
                        <a href="${pack.link}" target="_blank" class="card-btn">Abrir Link</a>
                    </div>
                `;
                grid.appendChild(card);
            });

            updatePaginationControls();
        }

        function updatePaginationControls() {
            const totalPages = Math.ceil(packsData.length / itemsPerPage) || 1;
            document.getElementById('page-info').innerText = `Página ${currentPage} de ${totalPages}`;
            document.getElementById('prev-btn').disabled = currentPage === 1;
            document.getElementById('next-btn').disabled = currentPage >= totalPages;
        }

        function changePage(direction) {
            const totalPages = Math.ceil(packsData.length / itemsPerPage) || 1;
            currentPage += direction;
            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages) currentPage = totalPages;
            renderGallery();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = function() {
            initAuth();
            autoDiscoverPacks();
        };
    </script>
</body>
</html>
