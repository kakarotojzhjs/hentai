<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Galeria</title>
    <style>
        :root {
            --bg-base: #090d16;
            --bg-card: #131b2e;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(99, 102, 241, 0.5);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-glow: rgba(99, 102, 241, 0.25);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        
        body { 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.06) 0%, transparent 40%);
            background-attachment: fixed;
        }
        
        header { 
            background: rgba(9, 13, 22, 0.75); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            position: sticky; 
            top: 0; 
            z-index: 100; 
            padding: 18px 32px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--border-subtle);
        }

        .logo { 
            font-size: 20px; 
            font-weight: 800; 
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #818cf8, #e879f9); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }

        .menu-options { display: flex; gap: 20px; align-items: center; }
        .user-info { color: var(--text-muted); font-size: 13px; }
        .user-info strong { color: var(--text-main); font-weight: 600; }
        
        .counter-badge { 
            background: rgba(16, 185, 129, 0.1); 
            border: 1px solid rgba(16, 185, 129, 0.25); 
            padding: 5px 12px; 
            border-radius: 30px; 
            font-size: 12px; 
            font-weight: 600; 
            color: #34d399; 
        }

        .btn-change-name { 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid var(--border-subtle); 
            color: var(--text-muted); 
            padding: 6px 14px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 13px; 
            transition: all 0.2s ease; 
        }
        .btn-change-name:hover { 
            border-color: var(--primary); 
            color: var(--text-main); 
            background: rgba(99, 102, 241, 0.1); 
        }

        main { flex: 1; padding: 30px 24px; max-width: 1200px; margin: 0 auto; width: 100%; display: flex; align-items: center; justify-content: center; }

        /* GRADE FIXA DE EXATAMENTE 3 COLUNAS E 5 LINHAS (3x5) */
        .gallery-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); /* 3 colunas na horizontal 👉 */
            grid-template-rows: repeat(5, auto);     /* 5 linhas na vertical 👇 */
            gap: 20px; 
            width: 100%;
        }

        .card { 
            background-color: var(--bg-card); 
            border-radius: 16px; 
            overflow: hidden; 
            border: 1px solid var(--border-subtle); 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
        
        .card:hover { 
            transform: translateY(-6px); 
            box-shadow: 0 20px 30px -10px var(--accent-glow); 
            border-color: var(--border-hover); 
        }

        /* AJUSTE PARA PROPORÇÃO 2:3 E ENCAIXE PERFEITO */
        .card-img-wrapper { 
            width: 100%; 
            aspect-ratio: 2 / 3; /* Força o espaço proporcional fixo em qualquer tela */
            overflow: hidden; 
            background-color: #0b101b; 
            position: relative;
        }

        .card img, .card video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; /* Encolhe ou estica a imagem/vídeo para preencher exatamente o wrapper sem distorcer */
            display: block;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        .card:hover img, .card:hover video { transform: scale(1.06); }

        .card-content { 
            padding: 16px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            flex: 1; 
            justify-content: space-between; 
        }

        .card-title { 
            font-size: 14px; 
            font-weight: 600; 
            color: var(--text-main); 
            line-height: 1.4; 
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-btn { 
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%; 
            padding: 10px; 
            background: linear-gradient(135deg, var(--primary), #818cf8); 
            color: white; 
            text-align: center; 
            text-decoration: none; 
            border-radius: 10px; 
            font-weight: 600; 
            font-size: 13px; 
            letter-spacing: 0.3px;
            transition: opacity 0.2s, transform 0.1s; 
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .card-btn:hover { opacity: 0.92; }
        .card-btn:active { transform: scale(0.98); }

        footer { 
            background: rgba(9, 13, 22, 0.75); 
            backdrop-filter: blur(16px);
            padding: 24px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 12px; 
            border-top: 1px solid var(--border-subtle); 
        }

        .pagination { display: flex; gap: 16px; align-items: center; }
        
        .page-btn { 
            padding: 10px 20px; 
            background: var(--bg-card); 
            color: var(--text-main); 
            border: 1px solid var(--border-subtle); 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 13px; 
            transition: all 0.2s; 
        }
        
        .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .page-btn:hover:not(:disabled) { 
            border-color: var(--primary); 
            background: rgba(99, 102, 241, 0.1); 
        }

        .page-info { font-size: 13px; color: var(--text-muted); font-weight: 500; }

        #login-modal { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(5, 8, 15, 0.85); 
            backdrop-filter: blur(12px); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 1000; 
            padding: 20px; 
        }

        .modal-content { 
            background: var(--bg-card); 
            padding: 36px; 
            border-radius: 20px; 
            width: 100%; 
            max-width: 400px; 
            border: 1px solid var(--border-subtle); 
            text-align: center; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); 
        }

        .modal-content h2 { margin-bottom: 8px; font-size: 20px; font-weight: 700; color: var(--text-main); }
        .modal-content p { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; line-height: 1.5; }
        
        .modal-content input { 
            width: 100%; 
            padding: 12px 16px; 
            margin-bottom: 20px; 
            background: var(--bg-base); 
            border: 1px solid var(--border-subtle); 
            color: white; 
            border-radius: 10px; 
            font-size: 14px; 
            outline: none; 
            transition: border-color 0.2s; 
        }
        .modal-content input:focus { border-color: var(--primary); }

        .modal-content button.btn-submit { 
            width: 100%; 
            padding: 12px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            font-weight: 600; 
            font-size: 14px; 
            border-radius: 10px; 
            cursor: pointer; 
            transition: opacity 0.2s; 
        }
        .modal-content button.btn-submit:hover { opacity: 0.9; }

        @media (max-width: 768px) {
            header { padding: 14px 20px; }
            main { padding: 20px 16px; }
            .gallery-grid { grid-template-columns: repeat(1, 1fr); grid-template-rows: repeat(15, auto); gap: 16px; }
        }
    </style>
</head>
<body>

    <div id="login-modal">
        <div class="modal-content">
            <h2>Bem-vindo(a)</h2>
            <p>Insira seu nome de usuário para acessar o painel.</p>
            <input type="text" id="username-input" placeholder="Seu nome..." autocomplete="off">
            <button class="btn-submit" onclick="handleLogin()">Entrar</button>
        </div>
    </div>

    <header>
        <div class="logo">⚡ Galeria</div>
        <div class="menu-options">
            <span class="user-info">Usuário: <strong id="current-user-display">-</strong></span>
            <div class="counter-badge">Cadastrados: <span id="user-counter">1</span></div>
            <button class="btn-change-name" onclick="openLoginModal()">Alterar</button>
        </div>
    </header>

    <main>
        <div class="gallery-grid" id="gallery-grid">
            <p style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 40px;">Carregando packs...</p>
        </div>
    </main>

    <footer>
        <div class="pagination">
            <button class="page-btn" id="prev-btn" onclick="changePage(-1)" disabled>← Anterior</button>
            <span class="page-info" id="page-info">Página 1 de 1</span>
            <button class="page-btn" id="next-btn" onclick="changePage(1)" disabled>Próxima →</button>
        </div>
    </footer>

    <script>
        let packsData = [];
        let currentPage = 1;
        const itemsPerPage = 15; // 3 colunas x 5 linhas = 15 itens por página

        function initAuth() {
            let currentUser = localStorage.getItem('site_current_user');
            if (!currentUser) {
                document.getElementById('login-modal').style.display = 'flex';
            } else {
                document.getElementById('login-modal').style.display = 'none';
                document.getElementById('current-user-display').innerText = currentUser;
                registerUser(currentUser);
            }
            updateUserCounter();
        }

        function handleLogin() {
            const input = document.getElementById('username-input').value.trim();
            if (!input) {
                alert('Digite um nome válido.');
                return;
            }
            localStorage.setItem('site_current_user', input);
            document.getElementById('login-modal').style.display = 'none';
            document.getElementById('current-user-display').innerText = input;
            
            registerUser(input);
            updateUserCounter();
        }

        function registerUser(username) {
            let usersList = JSON.parse(localStorage.getItem('site_users_list') || '[]');
            if (!usersList.includes(username)) {
                usersList.push(username);
                localStorage.setItem('site_users_list', JSON.stringify(usersList));
            }
            updateUserCounter();
        }

        function openLoginModal() {
            document.getElementById('username-input').value = localStorage.getItem('site_current_user') || '';
            document.getElementById('login-modal').style.display = 'flex';
        }

        function updateUserCounter() {
            let usersList = JSON.parse(localStorage.getItem('site_users_list') || '[]');
            let total = usersList.length > 0 ? usersList.length : 1;
            document.getElementById('user-counter').innerText = total;
        }

        async function autoDiscoverPacks() {
            packsData = [];
            let i = 1;
            let consecutiveFailures = 0;

            while (consecutiveFailures < 3 && i <= 250) {
                const folder = `pack/${i}`;
                try {
                    const infoRes = await fetch(`${folder}/info.txt?` + new Date().getTime());
                    if (infoRes.ok) {
                        const title = (await infoRes.text()).trim();
                        
                        let link = "#";
                        try {
                            const linkRes = await fetch(`${folder}/link.txt`);
                            if (linkRes.ok) link = (await linkRes.text()).trim();
                        } catch (e) {}

                        let image = `${folder}/capa.jpg`;
                        const mediaExtensions = ['webm', 'webp', 'jpg', 'png', 'jpeg', 'WEBM', 'WEBP', 'JPG', 'PNG'];
                        
                        for (let ext of mediaExtensions) {
                            const imgTest = await fetch(`${folder}/capa.${ext}`, { method: 'HEAD' });
                            if (imgTest.ok) {
                                image = `${folder}/capa.${ext}`;
                                break;
                            }
                        }

                        // Coloca sempre os packs mais novos no topo
                        packsData.unshift({ title, image, link });
                        consecutiveFailures = 0;
                    } else {
                        consecutiveFailures++;
                    }
                } catch (e) {
                    consecutiveFailures++;
                }
                i++;
            }

            renderGallery();
        }

        function getMediaElement(imagePath, title) {
            const ext = imagePath.split('.').pop().toLowerCase();
            
            if (ext === 'webm' || ext === 'mp4') {
                return `<video src="${imagePath}" autoplay muted loop playsinline></video>`;
            } else {
                return `<img src="${imagePath}" alt="${title}" onerror="this.src='https://via.placeholder.com/300x450?text=Sem+Capa'">`;
            }
        }

        function renderGallery() {
            const grid = document.getElementById('gallery-grid');
            grid.innerHTML = '';

            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginatedItems = packsData.slice(start, end);

            if (paginatedItems.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 50px 20px; background: var(--bg-card); border: 1px dashed var(--border-subtle); border-radius: 16px;">
                        <p style="color: #818cf8; font-weight: 600; margin-bottom: 8px; font-size: 15px;">Nenhum pack encontrado ainda!</p>
                        <p style="color: var(--text-muted); font-size: 13px; line-height: 1.6;">
                            Certifique-se de que cada pasta tem <b>info.txt</b>, <b>link.txt</b> e a capa<br>
                            (pode ser <b>capa.jpg</b>, <b>capa.png</b>, <b>capa.webm</b>, etc.).
                        </p>
                    </div>
                `;
                return;
            }

            paginatedItems.forEach(pack => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        ${getMediaElement(pack.image, pack.title)}
                    </div>
                    <div class="card-content">
                        <div class="card-title">${pack.title}</div>
                        <a href="${pack.link}" target="_blank" class="card-btn">Acessar Pack</a>
                    </div>
                `;
                grid.appendChild(card);
            });

            updatePaginationControls();
        }

        function updatePaginationControls() {
            const totalPages = Math.ceil(packsData.length / itemsPerPage) || 1;
            document.getElementById('page-info').innerText = `Página ${currentPage} de ${totalPages}`;
            document.getElementById('prev-btn').disabled = currentPage === 1;
            document.getElementById('next-btn').disabled = currentPage >= totalPages;
        }

        function changePage(direction) {
            const totalPages = Math.ceil(packsData.length / itemsPerPage) || 1;
            currentPage += direction;
            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages) currentPage = totalPages;
            renderGallery();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = function() {
            initAuth();
            autoDiscoverPacks();
        };
    </script>
</body>
</html>
