<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria GitHub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; min-height: 100vh; }
        
        header { background-color: #1f1f1f; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .logo { font-size: 20px; font-weight: bold; color: #ff4757; }
        .menu-options { display: flex; gap: 20px; align-items: center; }
        .menu-options span, .menu-options a { color: #ccc; text-decoration: none; cursor: pointer; font-size: 14px; }
        .menu-options a:hover { color: #fff; }
        .counter-badge { background-color: #333; padding: 5px 10px; border-radius: 12px; font-size: 13px; color: #4cd137; }

        main { flex: 1; padding: 30px; max-width: 1200px; margin: 0 auto; width: 100%; }

        /* Grade 3x5 (3 colunas, preenchendo até 15 itens por página) */
        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .card { background-color: #1e1e1e; border-radius: 8px; overflow: hidden; border: 1px solid #333; display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 180px; object-fit: cover; }
        .card-content { padding: 15px; }
        .card-title { font-size: 16px; margin-bottom: 10px; font-weight: bold; word-break: break-word; }
        .card-btn { display: block; width: 100%; padding: 10px; background-color: #ff4757; color: white; text-align: center; text-decoration: none; border-radius: 4px; font-weight: bold; transition: background 0.2s; }
        .card-btn:hover { background-color: #ff6b81; }

        footer { background-color: #1f1f1f; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; border-top: 1px solid #333; }
        .pagination { display: flex; gap: 10px; align-items: center; }
        .page-btn { padding: 8px 16px; background-color: #333; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .page-btn:hover:not(:disabled) { background-color: #444; }
        .page-info { font-size: 14px; color: #aaa; }

        #login-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1e1e1e; padding: 30px; border-radius: 8px; width: 320px; border: 1px solid #333; text-align: center; }
        .modal-content h2 { margin-bottom: 15px; font-size: 20px; }
        .modal-content input { width: 100%; padding: 10px; margin-bottom: 15px; background: #2c2c2c; border: 1px solid #444; color: white; border-radius: 4px; }
        .modal-content button { width: 100%; padding: 10px; background: #2ed573; color: white; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .modal-content button:hover { background: #26af5f; }

        @media (max-width: 768px) { .gallery-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <!-- Modal de Login (com substituição de nome para evitar múltiplas contas) -->
    <div id="login-modal">
        <div class="modal-content">
            <h2>Entrar / Registrar</h2>
            <p style="font-size: 12px; color: #aaa; margin-bottom: 15px;">Digite seu nome de usuário. Caso já tenha uma conta, seu nome anterior será substituído.</p>
            <input type="text" id="username-input" placeholder="Nome de usuário..." autocomplete="off">
            <button onclick="handleLogin()">Salvar e Entrar</button>
        </div>
    </div>

    <!-- Menu Superior -->
    <header>
        <div class="logo">Minha Galeria</div>
        <div class="menu-options">
            <span>Usuário: <strong id="current-user-display">-</strong></span>
            <div class="counter-badge">Usuários Totais: <span id="user-counter">1</span></div>
            <a href="#" onclick="openLoginModal()">Alterar Nome</a>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main>
        <div class="gallery-grid" id="gallery-grid">
            <p style="grid-column: span 3; text-align: center; color: #aaa;">Carregando packs do GitHub...</p>
        </div>
    </main>

    <!-- Rodapé com Paginação -->
    <footer>
        <div class="pagination">
            <button class="page-btn" id="prev-btn" onclick="changePage(-1)" disabled>Voltar</button>
            <span class="page-info" id="page-info">Página 1 de 1</span>
            <button class="page-btn" id="next-btn" onclick="changePage(1)" disabled>Avançar</button>
        </div>
    </footer>

    <script>
        let packsData = [];
        let currentPage = 1;
        const itemsPerPage = 15; // Grade de 3x5

        // Sistema de Usuário e Login (Substitui o nome anterior para evitar contas múltiplas)
        function initAuth() {
            let currentUser = localStorage.getItem('site_current_user');
            if (!currentUser) {
                document.getElementById('login-modal').style.display = 'flex';
            } else {
                document.getElementById('login-modal').style.display = 'none';
                document.getElementById('current-user-display').innerText = currentUser;
            }
            updateUserCounter();
        }

        function handleLogin() {
            const input = document.getElementById('username-input').value.trim();
            if (!input) {
                alert('Digite um nome válido.');
                return;
            }
            // Substitui o nome anterior garantindo unicidade por navegador
            localStorage.setItem('site_current_user', input);
            document.getElementById('login-modal').style.display = 'none';
            document.getElementById('current-user-display').innerText = input;
            updateUserCounter();
        }

        function openLoginModal() {
            document.getElementById('username-input').value = localStorage.getItem('site_current_user') || '';
            document.getElementById('login-modal').style.display = 'flex';
        }

        function updateUserCounter() {
            let total = localStorage.getItem('site_total_users');
            if (!total) {
                total = "1";
                localStorage.setItem('site_total_users', total);
            }
            document.getElementById('user-counter').innerText = total;
        }

        // Leitura Automática das Pastas direto do GitHub
        async function loadPacksFromGitHub() {
            const repoOwner = "SEU_USUARIO_GITHUB"; // Coloque seu usuário do GitHub aqui
            const repoName = "NOME_DO_REPOSITORIO";  // Coloque o nome do repositório aqui
            const apiUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/pack`;

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error("Erro ao acessar a pasta pack");
                const subfolders = await response.json();

                packsData = [];

                for (let folder of subfolders) {
                    if (folder.type === "dir") {
                        const folderName = folder.name;
                        const basePath = `pack/${folderName}`;

                        // Busca o conteúdo de info.txt e link.txt dentro de cada subpasta
                        let title = folderName;
                        let link = "#";

                        try {
                            const infoRes = await fetch(`${basePath}/info.txt`);
                            if (infoRes.ok) title = (await infoRes.text()).trim();
                        } catch (e) {}

                        try {
                            const linkRes = await fetch(`${basePath}/link.txt`);
                            if (linkRes.ok) link = (await linkRes.text()).trim();
                        } catch (e) {}

                        // Define a imagem de capa (suporta capa.jpg, capa.png, etc)
                        const image = `${basePath}/capa.jpg`;

                        packsData.push({ title, image, link });
                    }
                }

                renderGallery();
            } catch (error) {
                console.error(error);
                document.getElementById('gallery-grid').innerHTML = '<p style="grid-column: span 3; text-align: center; color: #ff4757;">Erro ao carregar packs. Verifique se o repositório é público e se alterou seu nome de usuário e repositório no código.</p>';
            }
        }

        // Renderização da Grade 3x5 e Paginação
        function renderGallery() {
            const grid = document.getElementById('gallery-grid');
            grid.innerHTML = '';

            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginatedItems = packsData.slice(start, end);

            if (paginatedItems.length === 0) {
                grid.innerHTML = '<p style="grid-column: span 3; text-align: center; color: #777;">Nenhum pack encontrado.</p>';
                return;
            }

            paginatedItems.forEach(pack => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${pack.image}" alt="${pack.title}" onerror="this.src='https://via.placeholder.com/300x180?text=Sem+Capa'">
                    <div class="card-content">
                        <div class="card-title">${pack.title}</div>
                        <a href="${pack.link}" target="_blank" class="card-btn">Abrir Link</a>
                    </div>
                `;
                grid.appendChild(card);
            });

            updatePaginationControls();
        }

        function updatePaginationControls() {
            const totalPages = Math.ceil(packsData.length / itemsPerPage) || 1;
            document.getElementById('page-info').innerText = `Página ${currentPage} de ${totalPages}`;
            document.getElementById('prev-btn').disabled = currentPage === 1;
            document.getElementById('next-btn').disabled = currentPage >= totalPages;
        }

        function changePage(direction) {
            const totalPages = Math.ceil(packsData.length / itemsPerPage) || 1;
            currentPage += direction;
            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages) currentPage = totalPages;
            renderGallery();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = function() {
            initAuth();
            loadPacksFromGitHub();
        };
    </script>
</body>
</html>
