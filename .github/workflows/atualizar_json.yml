name: Atualizar Packs JSON

on:
  push:
    paths:
      - 'pack/**'
      - 'ultimo.txt'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Executar script para gerar o packs.json
        run: python gerar_json.py

      - name: Enviar packs.json e tags.json atualizados de volta para o repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Atualizar arquivos packs.json e tags.json automaticamente"
          file_pattern: packs.json tags.json
          
