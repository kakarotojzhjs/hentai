name: Atualizar Packs JSON

on:
  push:
    paths:
      - 'pack/**'
      - 'ultimo.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Executar script para gerar o packs.json
        run: python gerar_json.py

      - name: Configurar git do bot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Enviar packs.json e tags.json atualizados
        run: |
          git add packs.json tags.json
          git diff --staged --quiet || git commit -m "Atualizar packs.json e tags.json automaticamente"
          git push
          
