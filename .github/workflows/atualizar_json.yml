name: Atualizar Packs JSON

on:
  push:
    paths:
      - 'pack/**'
      - 'ultimo.txt'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Executar script para gerar o packs.json
        run: python gerar_json.py

      - name: Enviar packs.json atualizado de volta para o repositorio
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Atualizar arquivo packs.json automaticamente"
          file_pattern: packs.json
          
